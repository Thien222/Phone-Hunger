name: Signed AAB
on: workflow_dispatch
jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.PH_UPLOAD_KEYSTORE_BASE64 }}
          STORE: ${{ secrets.PH_STORE_PASSWORD }}
          ALIAS: ${{ secrets.PH_KEY_ALIAS }}
          KEY: ${{ secrets.PH_KEY_PASSWORD }}
        run: test -n "$KEYSTORE" && test -n "$STORE" && test -n "$ALIAS" && test -n "$KEY"
      - name: Decode upload key
        env:
          KEYSTORE: ${{ secrets.PH_UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Build signed bundle
        env:
          PH_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          PH_STORE_PASSWORD: ${{ secrets.PH_STORE_PASSWORD }}
          PH_KEY_ALIAS: ${{ secrets.PH_KEY_ALIAS }}
          PH_KEY_PASSWORD: ${{ secrets.PH_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon lint testReleaseUnitTest bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: phonehunger-signed-aab
          path: app/build/outputs/bundle/release/*.aab
